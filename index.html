<html lang="it">

<head>
    <meta charset="UTF-8">

    <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'none'; form-action 'none'">
    <meta name="referrer" content="no-referrer">

    <title>Service Webpage</title>

    <!-- LANGUAGE ENGINE (dictionaries first, then the engine) -->
    <script src="i18n/lang.it.js"></script>
    <script src="i18n/lang.en.js"></script>
    <script src="i18n/i18n.js"></script>

    <!-- Language router: keeps the chosen language and forwards it to both pages.
         Placed in <head> so it is ready before the iframes send their first message. -->
    <script>
        (function () {
            var MESSAGE_TYPE = "service-webpage-language";
            var HELLO_TYPE = "service-webpage-language-hello";

            function getFrames() {
                return ["page-1", "page-2"]
                    .map(function (id) { return document.getElementById(id); })
                    .filter(Boolean);
            }

            function isOurFrame(source) {
                return getFrames().some(function (frame) {
                    return frame.contentWindow === source;
                });
            }

            window.addEventListener("message", function (event) {
                var data = event.data;

                if (!data || !isOurFrame(event.source)) {
                    return;
                }

                /* A page just loaded: tell it the current language. */
                if (data.type === HELLO_TYPE) {
                    event.source.postMessage(
                        { type: MESSAGE_TYPE, lang: window.I18N.getLanguage() },
                        "*"
                    );
                    return;
                }

                /* A page changed the language: update the root and the other page. */
                if (data.type === MESSAGE_TYPE) {
                    window.I18N.setLanguage(data.lang, { broadcast: false });

                    getFrames().forEach(function (frame) {
                        frame.contentWindow.postMessage(
                            { type: MESSAGE_TYPE, lang: window.I18N.getLanguage() },
                            "*"
                        );
                    });
                }
            });
        })();
    </script>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #05070a;
        }

        body {
            position: relative;
            font-family: Consolas, monospace;
        }

        /* =========================================================
           PAGE FRAMES
        ========================================================= */

        .page-frame {
            position: fixed;
            inset: 0;
            z-index: 2; 
            width: 100%;
            height: 100%;
            border: 0;

            opacity: 0;
            visibility: hidden;
            pointer-events: none;

            will-change: transform;

            transition: opacity 180ms ease;
        }

        .page-frame.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .page-frame.transitioning {
    transition: none;
    pointer-events: none;
    transform-origin: 50% 50%;
    backface-visibility: hidden;
}


/* =========================================================
   REAL-MOTION TRANSITION
   (--c-src / --c-dst / --c-pk are "r,g,b" triplets set by JS)
========================================================= */

.fx-bg {
    position: fixed;
    inset: 0;
    z-index: 1;

    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    overflow: hidden;

    --c-src: 49, 200, 255;
    --c-dst: 176, 108, 255;

    background:
        radial-gradient(ellipse 65% 55% at 50% 50%,
            rgba(var(--c-src), .16),
            transparent 62%),
        radial-gradient(ellipse 65% 55% at 50% 50%,
            rgba(var(--c-dst), .14) 15%,
            transparent 68%),
        radial-gradient(ellipse 44% 27% at 50% 57%, rgba(3, 5, 10, .78) 0%, rgba(3, 5, 10, .5) 55%, transparent 100%),
        linear-gradient(rgba(3, 5, 10, .32), rgba(3, 5, 10, .32)),
        url("transition/fx-background.webp") center / cover no-repeat,
        #03050a;
}

.fx-bg.running {
    visibility: visible;
}

.fx-hud {
    position: fixed;
    inset: 0;
    z-index: 4;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    --c-src: 49, 200, 255;
    --c-dst: 176, 108, 255;
    --c-pk: 49, 200, 255;
}

.fx-hud.running {
    visibility: visible;
    pointer-events: auto;
    cursor: progress;
}

.fx-stage {
    position: relative;
    flex: none;
    width: 720px;
    height: 200px;
    transform-origin: 50% 50%;
}

.fx-canvas {
    position: absolute;
    left: 0;
    top: 0;
    width: 720px;
    height: 200px;
    pointer-events: none;
}

.fx-track {
    position: absolute;
    left: 100px;
    top: 100px;
    width: 520px;
    height: 1px;
    background: linear-gradient(90deg,
        rgba(var(--c-src), .75),
        rgba(255, 255, 255, .35) 50%,
        rgba(var(--c-dst), .75));
    box-shadow: 0 0 6px rgba(200, 225, 255, .18);
}

.fx-fill {
    position: absolute;
    left: 100px;
    top: 99px;
    width: 520px;
    height: 3px;
    transform: scaleX(0);
    transform-origin: left center;
    border-radius: 2px;
    background: linear-gradient(90deg,
        rgba(var(--c-src), .55),
        rgba(var(--c-pk), .95));
    box-shadow: 0 0 9px rgba(var(--c-pk), .75);
}

.fx-trail {
    position: absolute;
    left: 0;
    top: 99px;
    width: 120px;
    height: 3px;
    opacity: 0;
    background: linear-gradient(90deg, transparent, rgba(var(--c-pk), .9));
    filter: blur(1px);
}

.fx-dot {
    position: absolute;
    top: 100px;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    border: 1px solid rgba(var(--dc), .8);
    background: rgba(var(--dc), calc(.12 + var(--g, 0) * .88));
    box-shadow: 0 0 calc(3px + var(--g, 0) * 12px) rgba(var(--dc), .9);
}

.fx-dot.big { width: 11px; height: 11px; }
.fx-dot.s { --dc: var(--c-src); }
.fx-dot.d { --dc: var(--c-dst); }

.fx-device {
    position: absolute;
    top: 100px;
    width: 64px;
    height: 48px;
    transform: translate(-50%, -50%);
    color: rgb(var(--dc));
    filter: drop-shadow(0 0 calc(4px + var(--g, 0) * 12px) rgba(var(--dc), .9));
}

.fx-device svg {
    display: block;
    width: 100%;
    height: 100%;
}

.fx-device.src { left: 56px; --dc: var(--c-src); }
.fx-device.dst { left: 664px; --dc: var(--c-dst); }

.fx-node {
    position: absolute;
    left: 360px;
    top: 100px;
    width: 110px;
    height: 110px;
    transform: translate(-50%, -50%);
    color: rgb(var(--hc, 200, 230, 255));
    filter: drop-shadow(0 0 calc(2px + var(--g, 0) * 18px) rgba(var(--hc, 200, 230, 255), .95));
}

.fx-node svg {
    display: block;
    width: 100%;
    height: 100%;
}

.fx-node-ring-arc {
    transform-box: fill-box;
    transform-origin: center;
}

.fx-node.active .fx-node-ring-arc {
    animation: fxNodeSpin 900ms linear infinite;
}

@keyframes fxNodeSpin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
}

.fx-node-label {
    position: absolute;
    left: 360px;
    top: 170px;
    transform: translate(-50%, 0);
    width: 280px;
    text-align: center;
    font-family: 'Orbitron', Consolas, monospace;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1.6px;
    color: rgb(var(--hc, 200, 230, 255));
    text-shadow: 0 0 8px rgba(var(--hc, 200, 230, 255), .7);
    opacity: 0;
    white-space: nowrap;
    pointer-events: none;
}

.fx-node-label span {
    display: inline-block;
}

.fx-ring {
    position: absolute;
    top: 100px;
    width: 96px;
    height: 96px;
    margin: -48px 0 0 -48px;
    border-radius: 50%;
    border: 2px solid rgba(var(--dc), .95);
    box-shadow:
        0 0 14px rgba(var(--dc), .7),
        inset 0 0 14px rgba(var(--dc), .35);
    opacity: 0;
    will-change: transform, opacity;
}

.fx-ring.src { left: 56px; --dc: var(--c-src); }
.fx-ring.dst { left: 664px; --dc: var(--c-dst); }
.fx-ring.arc { border-right-color: transparent; border-bottom-color: transparent; }

.fx-ring.dash {
    width: 136px;
    height: 136px;
    margin: -68px 0 0 -68px;
    border-style: dashed;
    border-width: 2px;
    box-shadow: none;
}

.fx-packet {
    position: absolute;
    left: 0;
    top: 100px;
    width: 26px;
    height: 14px;
    margin: -7px 0 0 -13px;
    opacity: 0;
    border-radius: 3px;
    border: 1px solid rgba(255, 255, 255, .85);
    background: linear-gradient(90deg,
        rgba(var(--c-pk), .55),
        #ffffff 45%,
        rgba(var(--c-pk), .8));
    box-shadow:
        0 0 6px #fff,
        0 0 16px rgba(var(--c-pk), .95),
        0 0 34px rgba(var(--c-pk), .55);
    will-change: transform, opacity;
}

.fx-deco {
    position: fixed;
    inset: 0;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transform-origin: 50% 50%;
    will-change: transform, opacity;
}

.fx-deco.running {
    visibility: visible;
}

.fx-dim {
    background: #03050a;
}

.fx-glow {
    outline: 2px solid rgb(var(--gc, 49, 200, 255));
    box-shadow: 0 0 60px rgba(var(--gc, 49, 200, 255), .7);
}

.fx-debug {
    position: fixed;
    left: 16px;
    bottom: 14px;
    z-index: 5;
    display: none;
    padding: 6px 10px;
    border-radius: 6px;
    background: rgba(0, 0, 0, .65);
    color: #c9f8ff;
    font: 12px Consolas, monospace;
    letter-spacing: 1px;
}


        /* =========================================================
           PAGE NAVIGATION (DATA TRANSFER SWITCH)
        ========================================================= */

        .page-navigation {
            position: fixed;
            left: 50%;

            width: 112px;
            height: 28px;

            /* --nav-shift: distance (px) the active page can still scroll down.
               0 = default position; > 0 = the bar travels with the page content. */
            transform: translateX(-50%) translateY(var(--nav-shift, 0px));

            z-index: 900;

            opacity: 1;
            visibility: visible;

            transition:
                opacity 160ms ease,
                visibility 160ms ease;
        }

        .page-navigation.page-one {
            left: 50%;
            bottom: 90px;
        }

        .page-navigation.page-two {
            left: 49.8%;
            bottom: 120px;
        }

        .page-navigation.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* While the page is being scrolled the bar is hidden (it would trail the
           content by a frame or two) and fades back in once the scroll stops. */
        .page-navigation.nav-scrolling {
            opacity: 0;
            pointer-events: none;
            transition-duration: 60ms;
        }

        /* =========================================================
           DATA CHANNEL
        ========================================================= */

        .switch-track {
            position: absolute;

            left: 25px;
            right: 25px;
            top: 50%;

            height: 1px;

            transform: translateY(-50%);

            background:
                linear-gradient(90deg,
                    rgba(220, 235, 240, .18),
                    rgba(225, 240, 244, .58) 25%,
                    rgba(245, 250, 252, .72) 50%,
                    rgba(225, 240, 244, .58) 75%,
                    rgba(220, 235, 240, .18));

            box-shadow:
                0 0 4px rgba(225, 240, 245, .20);
        }

        .switch-track::after {
            content: "";

            position: absolute;

            left: 0;
            right: 0;
            top: -2px;

            height: 5px;

            background:
                linear-gradient(90deg,
                    transparent,
                    rgba(230, 242, 246, .14),
                    transparent);

            filter: blur(2px);
        }

        /* =========================================================
           ENDPOINT NODES
        ========================================================= */

        .switch-node {
            position: absolute;

            top: 50%;

            width: 7px;
            height: 7px;

            transform: translateY(-50%);

            background: #070a0d;

            border: 1px solid rgba(225, 240, 244, .48);

            clip-path: polygon(25% 0%,
                    75% 0%,
                    100% 50%,
                    75% 100%,
                    25% 100%,
                    0% 50%);

            transition:
                opacity 160ms ease,
                box-shadow 160ms ease,
                background 160ms ease;
        }

        .switch-node-left {
            left: 21px;
        }

        .switch-node-right {
            right: 21px;
        }

        .switch-node.active {
            background: rgba(225, 240, 244, .95);

            box-shadow:
                0 0 4px rgba(230, 245, 248, .90),
                0 0 8px rgba(210, 235, 240, .38);

            opacity: 1;
        }

        .switch-node.inactive {
            opacity: .32;
        }

        /* =========================================================
           DATA PACKET
        ========================================================= */

        .switch-core {
            position: absolute;

            left: 19px;
            top: 50%;

            width: 14px;
            height: 10px;

            transform:
                translateY(-50%) skewX(-18deg);

            z-index: 10;

            background:
                linear-gradient(90deg,
                    rgba(125, 145, 151, .30),
                    rgba(238, 248, 250, .96) 45%,
                    rgba(145, 168, 174, .50));

            border: 1px solid rgba(235, 248, 250, .82);

            box-shadow:
                0 0 3px rgba(235, 248, 250, .95),
                0 0 8px rgba(215, 238, 242, .42);

            transition:
                left 520ms cubic-bezier(.18, .72, .18, 1),
                filter 160ms ease;
        }

        .switch-core::before {
            content: "";

            position: absolute;

            left: 3px;
            right: 3px;
            top: 3px;

            height: 2px;

            background:
                linear-gradient(90deg,
                    transparent,
                    rgba(250, 255, 255, .95),
                    transparent);

            box-shadow:
                0 0 3px rgba(240, 250, 252, .85);
        }

        .switch-core::after {
            content: "";

            position: absolute;

            left: -7px;
            top: 3px;

            width: 6px;
            height: 2px;

            background:
                linear-gradient(90deg,
                    transparent,
                    rgba(225, 242, 245, .72));

            box-shadow:
                0 0 4px rgba(220, 240, 244, .35);
        }

        /* =========================================================
           PACKET TRAIL
        ========================================================= */

        .switch-trail {
            position: absolute;

            top: 50%;
            left: 19px;

            width: 20px;
            height: 1px;

            transform: translateY(-50%);

            opacity: 0;

            background:
                linear-gradient(90deg,
                    transparent,
                    rgba(230, 245, 248, .58),
                    rgba(230, 245, 248, .10));

            filter: blur(.2px);

            transition:
                left 520ms cubic-bezier(.18, .72, .18, 1),
                opacity 160ms ease;
        }

        .page-navigation.core-moving .switch-trail {
            opacity: .85;
        }

        /* =========================================================
           DATA PULSE
        ========================================================= */

        .page-navigation.core-moving .switch-track::before {
            content: "";

            position: absolute;

            top: -1px;
            left: 0;

            width: 14px;
            height: 3px;

            background:
                linear-gradient(90deg,
                    transparent,
                    rgba(245, 252, 253, .90),
                    transparent);

            filter: blur(1px);

            animation: dataPulse 520ms linear;
        }

        @keyframes dataPulse {
            from {
                transform: translateX(0);
                opacity: 0;
            }

            15% {
                opacity: 1;
            }

            85% {
                opacity: 1;
            }

            to {
                transform: translateX(84px);
                opacity: 0;
            }
        }

        /* =========================================================
           ARROWS
        ========================================================= */

        .switch-arrow {
            position: absolute;

            top: 50%;

            width: 16px;
            height: 20px;

            padding: 0;

            transform: translateY(-50%);

            border: 0;
            outline: none;

            background: transparent;

            color: rgba(225, 238, 242, .66);

            font-family: Consolas, monospace;
            font-size: 9px;
            line-height: 20px;

            cursor: pointer;

            transition:
                color 120ms ease,
                text-shadow 120ms ease;
        }

        .switch-arrow:hover {
            color: rgba(245, 252, 253, .98);

            text-shadow:
                0 0 5px rgba(225, 240, 245, .55);
        }

        .switch-arrow-left {
            left: 0;
        }

        .switch-arrow-right {
            right: 0;
        }

        /* =========================================================
           REDUCED MOTION
        ========================================================= */

        @media (prefers-reduced-motion: reduce) {

            .page-frame,
            .page-navigation,
            .switch-core,
            .switch-trail {
                transition-duration: 0ms !important;
            }

            .page-navigation.core-moving .switch-track::before {
                animation: none;
            }
        }
    </style>
</head>

<body>

    <!-- =========================================================
         PAGE 1
    ========================================================= -->

    <iframe id="page-1" class="page-frame active" src="Page_1/index.html" title="Service Webpage - Page 1">
    </iframe>

    <!-- =========================================================
         PAGE 2
    ========================================================= -->

    <iframe id="page-2" class="page-frame" src="Page_2/index.html" title="Service Webpage - Page 2">
    </iframe>

    
    <!-- REAL-MOTION TRANSITION -->
    
    <div class="fx-bg" id="fx-bg" aria-hidden="true"></div>
    
    <div class="fx-hud" id="fx-hud" aria-hidden="true">
        <div class="fx-stage" id="fx-stage">
    
            <canvas class="fx-canvas" id="fx-canvas" width="1440" height="400"></canvas>
    
            <div class="fx-track"></div>
            <div class="fx-fill" id="fx-fill"></div>
    
            <span class="fx-dot s big" style="left:110px" data-x="110"></span>
            <span class="fx-dot s" style="left:165px" data-x="165"></span>
            <span class="fx-dot d" style="left:555px" data-x="555"></span>
            <span class="fx-dot d big" style="left:610px" data-x="610"></span>
    
            <div class="fx-node" id="fx-node">
                <svg viewBox="0 0 120 120" fill="none">
                    <circle cx="60" cy="60" r="52" stroke="currentColor" stroke-width="1.4" stroke-dasharray="4 7" opacity=".5" />
                    <circle class="fx-node-ring-arc" id="fx-node-ring-arc" cx="60" cy="60" r="40" stroke="currentColor"
                        stroke-width="2.6" stroke-dasharray="44 196" stroke-linecap="round" />
                    <g stroke="currentColor" stroke-width="1.6">
                        <rect x="24" y="30" width="72" height="18" rx="3" fill="rgba(4,8,16,.95)" />
                        <rect x="24" y="52" width="72" height="18" rx="3" fill="rgba(4,8,16,.95)" />
                        <rect x="24" y="74" width="72" height="18" rx="3" fill="rgba(4,8,16,.95)" />
                    </g>
                    <circle id="fx-node-led-1" cx="34" cy="39" r="2.8" fill="currentColor" stroke="none" />
                    <circle id="fx-node-led-2" cx="34" cy="61" r="2.8" fill="currentColor" stroke="none" />
                    <circle id="fx-node-led-3" cx="34" cy="83" r="2.8" fill="currentColor" stroke="none" />
                </svg>
            </div>
            
            <div class="fx-node-label" id="fx-node-label"><span id="fx-node-label-text">PROCESSING REQUEST</span></div>
    
            <div class="fx-device src" id="fx-src">
                <svg viewBox="0 0 64 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"
                    stroke-linejoin="round">
                    <rect x="11" y="5" width="42" height="28" rx="3.5" fill="rgba(4,8,16,.75)" />
                    <path d="M3 41h58" />
                </svg>
            </div>
    
            <div class="fx-device dst" id="fx-dst">
                <svg viewBox="0 0 64 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"
                    stroke-linejoin="round">
                    <rect x="11" y="5" width="42" height="28" rx="3.5" fill="rgba(4,8,16,.75)" />
                    <path d="M3 41h58" />
                </svg>
            </div>
    
            <div class="fx-ring src" id="fx-ring-src"></div>
            <div class="fx-ring dst arc" id="fx-ring-arc"></div>
            <div class="fx-ring dst" id="fx-ring-dst"></div>
            <div class="fx-ring dst dash" id="fx-ring-dash"></div>
    
            <div class="fx-trail" id="fx-trail"></div>
            <div class="fx-packet" id="fx-packet"></div>
    
        </div>
    </div>
    
    <div class="fx-debug" id="fx-debug"></div>

    <!-- =========================================================
         PAGE NAVIGATION BAR
    ========================================================= -->

    <div class="page-navigation page-one hidden" id="page-navigation">

        <button type="button" class="switch-arrow switch-arrow-left" id="page-button-1" data-i18n-aria-label="nav.page1" aria-label="Vai alla Page 1">
            ◀
        </button>

        <div class="switch-track" aria-hidden="true">
        </div>

        <div class="switch-node switch-node-left active" id="switch-node-left" aria-hidden="true">
        </div>

        <div class="switch-node switch-node-right inactive" id="switch-node-right" aria-hidden="true">
        </div>

        <div class="switch-trail" id="switch-trail" aria-hidden="true">
        </div>

        <div class="switch-core" id="switch-core" aria-hidden="true">
        </div>

        <button type="button" class="switch-arrow switch-arrow-right" id="page-button-2" data-i18n-aria-label="nav.page2" aria-label="Vai alla Page 2">
            ▶
        </button>

    </div>

    <script>
        const page1 = document.getElementById("page-1");
        const page2 = document.getElementById("page-2");

        page1.addEventListener("load", () => setFrameLite(page1, false));
        page2.addEventListener("load", () => setFrameLite(page2, false));

        const navigation = document.getElementById("page-navigation");

        const buttonPage1 = document.getElementById("page-button-1");
        const buttonPage2 = document.getElementById("page-button-2");

    /* The switch bar stays hidden until Page 1 has loaded */
    let navigationRevealed = false;

    function revealNavigation() {

        if (navigationRevealed) return;
        navigationRevealed = true;

        if (transitionRunning) return;

        requestAnimationFrame(() => navigation.classList.remove("hidden"));
    }

    page1.addEventListener("load", revealNavigation);
    window.setTimeout(revealNavigation, 3000);

        window.addEventListener(
                "message",
                event => {

                    if (
                        (event.source !== page1.contentWindow &&
                            event.source !== page2.contentWindow) ||
                        !event.data ||
                        event.data.type !== "add-service-modal"
                    ) {
                        return;
                    }

                    if (event.data.open) {

                        navigation.style.zIndex = "-1";

                    } else {

                        navigation.style.zIndex = "900";

                    }

                }
            );

        const nodeLeft = document.getElementById("switch-node-left");
        const nodeRight = document.getElementById("switch-node-right");

        const core = document.getElementById("switch-core");
        const trail = document.getElementById("switch-trail");

        let currentPage = 1;
        let transitionRunning = false;

        /* =========================================================
           SWITCH BAR vs PAGE SCROLL

           When a page is taller than the window (short window, narrow layout)
           it scrolls inside its frame. Each page reports how far it can still
           scroll; the bar then travels with the page content and stays in its
           usual place relative to the page bottom, instead of floating over
           the cards. When the page does not scroll the shift is 0 and the bar
           sits in its default position.
        ========================================================= */

        const navShift = { 1: 0, 2: 0 };

        function applyNavShift() {
            navigation.style.setProperty("--nav-shift", navShift[currentPage] + "px");
        }

        /* Hides the bar while the shift keeps changing, shows it 150 ms after the
           last change. Nothing happens when the page does not scroll. */
        let navScrollTimer = null;

        function pulseNavScrolling() {
            navigation.classList.add("nav-scrolling");

            window.clearTimeout(navScrollTimer);

            navScrollTimer = window.setTimeout(() => {
                navigation.classList.remove("nav-scrolling");
            }, 150);
        }

        window.addEventListener("message", event => {

            const data = event.data;

            if (!data || data.type !== "service-webpage-scroll") {
                return;
            }

            const frameNumber =
                event.source === page1.contentWindow ? 1 :
                event.source === page2.contentWindow ? 2 : 0;

            if (!frameNumber) {
                return;
            }

            const previous = navShift[frameNumber];
            const next = Math.max(0, Number(data.remaining) || 0);

            navShift[frameNumber] = next;

            if (frameNumber !== currentPage) {
                return;
            }

            if (previous !== next && (previous > 0 || next > 0)) {
                pulseNavScrolling();
            }

            applyNavShift();
        });


        /* =========================================================
           ENDPOINT STATE
        ========================================================= */

        function updateNodes(page) {

            if (page === 1) {

                nodeLeft.classList.add("active");
                nodeLeft.classList.remove("inactive");

                nodeRight.classList.add("inactive");
                nodeRight.classList.remove("active");

            } else {

                nodeRight.classList.add("active");
                nodeRight.classList.remove("inactive");

                nodeLeft.classList.add("inactive");
                nodeLeft.classList.remove("active");
            }
        }

        /* =========================================================
           HUD POSITION
        ========================================================= */

        function setNavigationPage(page) {

            navigation.classList.remove(
                "page-one",
                "page-two"
            );

            if (page === 1) {
                navigation.classList.add("page-one");
            } else {
                navigation.classList.add("page-two");
            }
        }

        /* =========================================================
           PACKET POSITION
        ========================================================= */

        function setCorePosition(page) {

            if (page === 1) {

                core.style.left = "19px";
                trail.style.left = "19px";

            } else {

                core.style.left = "79px";
                trail.style.left = "79px";
            }
        }

        /* =========================================================
           DATA TRANSFER ANIMATION
        ========================================================= */

        function animateCoreToPage(
            targetPage,
            previousPage
        ) {

            setNavigationPage(targetPage);

            updateNodes(previousPage);

            setCorePosition(previousPage);

            navigation.offsetHeight;

            navigation.classList.remove("hidden");

            navigation.classList.add("core-moving");

            requestAnimationFrame(() => {

                requestAnimationFrame(() => {

                    setCorePosition(targetPage);

                    updateNodes(targetPage);

                });

            });

            window.setTimeout(() => {

                navigation.classList.remove(
                    "core-moving"
                );

            }, 540);
        }

        /* =========================================================
           PAGE SWITCH
        ========================================================= */

        function completePageSwitch(targetPage) {

                page1.classList.remove("active");
                page2.classList.remove("active");

                if (targetPage === 1) {
                    page1.classList.add("active");
                } else {
                    page2.classList.add("active");
                }

                currentPage = targetPage;
                applyNavShift();
            }

        /* =========================================================
       REAL-MOTION TRANSITION ENGINE
    
       Times in "storyboard ms":
         0 START · 100 DEPARTURE · 200 TRANSFER
         350 ARRIVAL · 450 SWAP · 550 COMPLETED
       The packet always travels from left to right.
        ========================================================= */

            const FX = {
                    DURATION_SCALE: 2.2,   // shrink to icon + enlarge (unchanged)
                    MID_SCALE: 3.1,        // packet travel + dwell in the server: higher = slower
                    DOCK_MS: 250,        // pre-roll: the page turns into a card
                    END_MS: 650,
                    DEBUG: false         // true = shows time and phase at the bottom left
                };

            const PAGE_COLORS = {
                1: [49, 200, 255],
                2: [176, 108, 255]
            };

            const FX_PHASES = [
                [650, "COMPLETED"],
                [550, "DASHBOARD SWAP"],
                [450, "PACKET ARRIVING"],
                [300, "PACKET TRANSFER"],
                [140, "PROCESSING REQUEST"],
                [100, "PACKET DEPARTING"],
                [0, "TRANSITION START"],
                [-Infinity, "PRE-ROLL"]
            ];

            const fxBg = document.getElementById("fx-bg");
            const fxHud = document.getElementById("fx-hud");
            const fxStage = document.getElementById("fx-stage");
            const fxCanvas = document.getElementById("fx-canvas");
            const fxCtx = fxCanvas.getContext("2d");
            const fxFill = document.getElementById("fx-fill");
            const fxTrail = document.getElementById("fx-trail");
            const fxPacket = document.getElementById("fx-packet");
            const fxNode = document.getElementById("fx-node");
            const fxNodeLabel = document.getElementById("fx-node-label");
            const fxNodeLabelText = document.getElementById("fx-node-label-text");
            const fxNodeLed1 = document.getElementById("fx-node-led-1");
            const fxNodeLed2 = document.getElementById("fx-node-led-2");
            const fxNodeLed3 = document.getElementById("fx-node-led-3");
            const fxSrc = document.getElementById("fx-src");
            const fxDst = document.getElementById("fx-dst");
            const fxRingSrc = document.getElementById("fx-ring-src");
            const fxRingArc = document.getElementById("fx-ring-arc");
            const fxRingDst = document.getElementById("fx-ring-dst");
            const fxRingDash = document.getElementById("fx-ring-dash");
            const fxDebug = document.getElementById("fx-debug");
            const fxDots = [...document.querySelectorAll(".fx-dot")]
                .map(el => ({ el, x: Number(el.dataset.x) }));


            const TRACK_L = 100;
            const TRACK_W = 520;
            const CY = 100;
            const SRC_X = 56;
            const DST_X = 664;

            const clamp01 = v => Math.min(1, Math.max(0, v));
            const seg = (t, a, b) => clamp01((t - a) / (b - a));
            const lerp = (a, b, k) => a + (b - a) * k;
            const easeOut = k => 1 - Math.pow(1 - k, 3);
            const easeInOut = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
            const bell = (t, c, w) => Math.max(0, 1 - Math.abs(t - c) / w);
            const mix = (a, b, k) => a.map((v, i) => lerp(v, b[i], k));
            const rgbT = c => `${Math.round(c[0])},${Math.round(c[1])},${Math.round(c[2])}`;
            const rgba = (c, a) => `rgba(${rgbT(c)},${a})`;

            let fxState = null;
            let particles = [];

            function packetProgress(t) {
                    if (t < 140) {
                        const u = seg(t, 40, 140);
                        return 0.04 + 0.46 * (1 - Math.pow(1 - u, 2.2));
                    }
                    if (t < 260) {
                        return 0.5;
                    }
                    const u = seg(t, 260, 500);
                    return 0.5 + 0.46 * (1 - Math.pow(1 - u, 1.6));
                }

                function packetVisibility(t) {
                    if (t < 30) return 0;
                    if (t < 55) return seg(t, 30, 55);
                    if (t < 120) return 1;
                    if (t < 150) return 1 - seg(t, 120, 150);
                    if (t < 250) return 0;
                    if (t < 280) return seg(t, 250, 280);
                    if (t < 495) return 1;
                    if (t < 530) return 1 - seg(t, 495, 530);
                    return 0;
                }

                function nodeGlowFn(t) {
                    const rise = seg(t, 90, 150);
                    const fall = 1 - seg(t, 250, 330);
                    return Math.min(rise, fall);
                }

            function emitParticle(x, y, vx, vy, life, size, color) {
                if (particles.length > 260) return;
                particles.push({ x, y, vx, vy, life, age: 0, size, color });
            }

            function burst(x, y, count, speedMin, speedMax, color) {
                for (let i = 0; i < count; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = lerp(speedMin, speedMax, Math.random());
                    emitParticle(
                        x, y,
                        Math.cos(angle) * speed,
                        Math.sin(angle) * speed,
                        lerp(280, 520, Math.random()),
                        lerp(1.5, 3.2, Math.random()),
                        color
                    );
                }
            }

            function stepParticles(dt) {
                fxCtx.setTransform(1, 0, 0, 1, 0, 0);
                fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
                fxCtx.setTransform(2, 0, 0, 2, 0, 0);
                fxCtx.globalCompositeOperation = "lighter";

                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    p.age += dt;
                    if (p.age >= p.life) {
                        particles.splice(i, 1);
                        continue;
                    }
                    p.x += p.vx * dt;
                    p.y += p.vy * dt;
                    fxCtx.fillStyle = rgba(p.color, (1 - p.age / p.life) * .9);
                    fxCtx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
                }
            }

            function createDeco(className) {
                    const el = document.createElement("div");
                    el.className = "fx-deco " + className;
                    document.body.appendChild(el);
                    return el;
                }

                const decoOutDim = createDeco("fx-dim");
                const decoOutGlow = createDeco("fx-glow");
                const decoInDim = createDeco("fx-dim");
                const decoInGlow = createDeco("fx-glow");
                const allDecos = [decoOutDim, decoOutGlow, decoInDim, decoInGlow];

                function setCardTransform(elements, x, scale, rotY) {
                    const value = `perspective(1600px) translate3d(${x}%,0,0) rotateY(${rotY}deg) scale(${scale})`;
                    elements.forEach(el => { el.style.transform = value; });
                }

                function clearFrameStyle(el) {
                    el.style.transform = "";
                    el.style.opacity = "";
                    el.style.visibility = "";
                    el.style.zIndex = "";
                    el.classList.remove("transitioning");
                }

                function setFrameLite(frame, on) {
                    try {
                        const doc = frame.contentDocument;
                        if (!doc || !doc.head) return;

                        let style = doc.getElementById("fx-lite-style");

                        if (!style) {
                            style = doc.createElement("style");
                            style.id = "fx-lite-style";
                            style.textContent =
                                "*,*::before,*::after{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}";
                            doc.head.appendChild(style);
                        }

                        style.disabled = !on;
                    } catch (error) {
                        /* different origin: ignore */
                    }
                }

            function prepareFx(previousPage, targetPage) {

                    const outFrame = previousPage === 1 ? page1 : page2;
                    const inFrame = targetPage === 1 ? page1 : page2;

                    const srcColor = PAGE_COLORS[previousPage];
                    const dstColor = PAGE_COLORS[targetPage];

                    fxHud.style.setProperty("--c-src", rgbT(srcColor));
                    fxHud.style.setProperty("--c-dst", rgbT(dstColor));
                    fxHud.style.setProperty("--c-pk", rgbT(srcColor));

                    fxBg.style.setProperty("--c-src", rgbT(srcColor));
                    fxBg.style.setProperty("--c-dst", rgbT(dstColor));

                    decoOutGlow.style.setProperty("--gc", rgbT(srcColor));
                    decoInGlow.style.setProperty("--gc", rgbT(dstColor));

                    fxState = {
                        outFrame,
                        inFrame,
                        srcColor,
                        dstColor,
                        dir: targetPage > previousPage ? 1 : -1,
                        stageScale: Math.min(1.25, Math.max(.55, window.innerWidth / 1500)),
                        burstLaunch: false,
                        burstArrive: false,
                        burstSwap: false,
                        emitCarry: 0
                    };

                    particles = [];

                    setFrameLite(page1, true);
                    setFrameLite(page2, true);

                    [outFrame, inFrame].forEach(el => {
                    el.classList.add("transitioning");
                    el.style.visibility = "visible";
                });

                    outFrame.style.zIndex = "2";
                    inFrame.style.zIndex = "3";

                    outFrame.style.opacity = "1";
                    inFrame.style.opacity = "1";

                    decoOutDim.style.zIndex = "2";
                    decoOutGlow.style.zIndex = "2";
                    decoInDim.style.zIndex = "3";
                    decoInGlow.style.zIndex = "3";

                    allDecos.forEach(el => el.classList.add("running"));

                    fxBg.classList.add("running");
                    fxHud.classList.add("running");

                    if (FX.DEBUG) fxDebug.style.display = "block";

                /* initial state: computed IMMEDIATELY, at the very instant of the click,
                   so the browser never paints the incoming page at full screen,
                   not even for a single frame */

                renderFx(-FX.DOCK_MS, 0);

                }

            function renderFx(t, dt) {

                const s = fxState;
                if (!s) return;

                const dock = easeOut(seg(t, -FX.DOCK_MS, 0));
                const swap = easeInOut(seg(t, 550, 650));
                const arrive = seg(t, 430, 550);

                /* outgoing page → card on the left → exits (or the reverse, depending on direction) */

                const outX = (lerp(0, -46, dock) + lerp(0, -38, swap)) * s.dir;
                const outS = lerp(lerp(1, .5, dock), .36, swap);
                const outR = lerp(0, 20, dock) * s.dir;

                setCardTransform([s.outFrame, decoOutDim, decoOutGlow], outX, outS, outR);

                decoOutDim.style.opacity = 1 - lerp(1, .78, dock) * (1 - swap);
                decoOutGlow.style.opacity = Math.min(1, .88 * dock * (1 - swap));

                /* incoming page → same size/position as before (preview
                visible right away, at scale .5), but the reveal happens
                by fading the opacity of the real content — it starts from 0 like
                the veil of the outgoing page does — not with a black overlay */

                const inX = lerp(46, 0, swap) * s.dir;
                const inS = lerp(.5, 1, swap);
                const inR = lerp(-20, 0, swap) * s.dir;

                setCardTransform([s.inFrame, decoInGlow], inX, inS, inR);

                s.inFrame.style.opacity = lerp(dock * lerp(.55, .8, arrive), 1, swap);

                decoInDim.style.opacity = 0;
                decoInGlow.style.opacity = Math.min(1, dock * (.4 + .8 * arrive) * (1 - swap));

                fxBg.style.opacity = dock * (1 - seg(t, 580, 660));
                fxHud.style.opacity = dock * (1 - seg(t, 565, 645));


                 fxStage.style.transform =
                    `translateY(4vh) scale(${s.stageScale * lerp(.9, 1, dock)}) scaleX(${s.dir})`;

                /* packet */
                const p = packetProgress(t);
                const px = TRACK_L + TRACK_W * p;
                const packetOpacity = packetVisibility(t);
                const packetScale =
                    (1 - .5 * seg(t, 120, 150)) *
                    (1 - .5 * seg(t, 495, 530));
                const packetColor = mix(s.srcColor, s.dstColor, p);

                fxHud.style.setProperty("--c-pk", rgbT(packetColor));

                fxPacket.style.opacity = packetOpacity;
                fxPacket.style.transform =
                    `translate3d(${px}px,0,0) skewX(-18deg) scale(${packetScale})`;

                fxTrail.style.opacity = packetOpacity * .95;
                fxTrail.style.transform = `translate3d(${px - 118}px,0,0)`;

                fxFill.style.transform = `scaleX(${clamp01((px - TRACK_L) / TRACK_W)})`;
                fxFill.style.opacity = seg(t, 30, 55) * (1 - seg(t, 400, 480));

                /* dots along the track */
                const dotFade = 1 - seg(t, 500, 570);

                fxDots.forEach(dot => {
                    const d = px - dot.x;
                    const g = d < 0 ? clamp01(1 + d / 40) : clamp01(1 - d / 220);
                    dot.el.style.setProperty(
                        "--g",
                        (g * seg(t, 30, 60) * dotFade).toFixed(3)
                    );
                });

                /* server node: packet processing */
                const nodeGlow = nodeGlowFn(t);
                const labelGlow = Math.min(seg(t, 20, 60), 1 - seg(t, 260, 320));

                const nodeColor = rgbT(mix([200, 230, 255], packetColor, .55 * nodeGlow));
                const labelColor = rgbT(mix([200, 230, 255], packetColor, .55 * labelGlow));

                fxNode.style.setProperty("--g", nodeGlow.toFixed(3));
                fxNode.style.setProperty("--hc", nodeColor);
                fxNode.classList.toggle("active", nodeGlow > 0.08);

                fxNodeLabel.style.setProperty("--hc", labelColor);
                fxNodeLabel.style.opacity = labelGlow;
                fxNodeLabelText.style.transform = `scaleX(${s.dir})`;

                const dwellCore = seg(t, 150, 250);
                const ledOn = threshold =>
                    clamp01((dwellCore - threshold) / 0.12) * nodeGlow;

                fxNodeLed1.style.opacity = Math.max(.25, ledOn(0.10));
                fxNodeLed2.style.opacity = Math.max(.25, ledOn(0.40));
                fxNodeLed3.style.opacity = Math.max(.25, ledOn(0.70));

                /* laptop */
                fxSrc.style.setProperty("--g", Math.max(.3, bell(t, 100, 130) * .95).toFixed(3));
                fxDst.style.setProperty("--g", Math.max(.25, arrive * .55, bell(t, 450, 120)).toFixed(3));

                /* departure ring */
                const srcIn = easeOut(seg(t, 40, 105));
                const srcOut = seg(t, 105, 280);
                fxRingSrc.style.opacity = srcIn * (1 - srcOut);
                fxRingSrc.style.transform = `scale(${lerp(.55, 1.05, srcIn) + .35 * srcOut})`;

                /* arrival arc (350 ms) */
                const arcIn = easeOut(seg(t, 335, 430));
                const arcOut = seg(t, 440, 500);
                fxRingArc.style.opacity = arcIn * (1 - arcOut);
                fxRingArc.style.transform = `rotate(${t * .55}deg) scale(${lerp(.7, 1.12, arcIn)})`;

                /* solid + dashed ring (450 ms) */
                const ringIn = easeOut(seg(t, 400, 462));
                const ringOut = seg(t, 470, 550);
                fxRingDst.style.opacity = ringIn * (1 - ringOut);
                fxRingDst.style.transform = `scale(${lerp(.75, 1.05, ringIn) + .5 * ringOut})`;
                fxRingDash.style.opacity = ringIn * .85 * (1 - ringOut);
                fxRingDash.style.transform =
                    `rotate(${-t * .32}deg) scale(${lerp(.7, 1, ringIn) + .3 * ringOut})`;

                /* particles */
                if (t >= 40 && t <= 500) {
                    s.emitCarry += dt / 5;
                    while (s.emitCarry >= 1) {
                        s.emitCarry -= 1;
                        emitParticle(
                            px - 8,
                            CY + (Math.random() - .5) * 8,
                            -lerp(.02, .11, Math.random()),
                            (Math.random() - .5) * .09,
                            lerp(220, 420, Math.random()),
                            lerp(1.4, 3, Math.random()),
                            packetColor
                        );
                    }
                }

                if (t >= 40 && !s.burstLaunch) {
                    s.burstLaunch = true;
                    burst(SRC_X + 36, CY, 12, .04, .13, s.srcColor);
                }

                if (t >= 450 && !s.burstArrive) {
                    s.burstArrive = true;
                    burst(DST_X - 20, CY, 14, .04, .12, s.dstColor);
                }

                if (t >= 550 && !s.burstSwap) {
                    s.burstSwap = true;
                    burst(DST_X, CY, 30, .06, .2, mix(s.dstColor, [255, 255, 255], .35));
                }

                stepParticles(dt);

                if (FX.DEBUG) {
                    const phase = FX_PHASES.find(([start]) => t >= start)[1];
                    fxDebug.textContent = `${Math.round(t)} ms  ·  ${phase}`;
                }
            }

            function cleanupFx() {

                if (!fxState) return;

                clearFrameStyle(fxState.outFrame);
                clearFrameStyle(fxState.inFrame);

                    allDecos.forEach(el => {
                    el.classList.remove("running");
                    el.style.transform = "";
                    el.style.opacity = "";
                    el.style.zIndex = "";
                });

                setFrameLite(page1, false);
                setFrameLite(page2, false);

                fxBg.classList.remove("running");
                fxHud.classList.remove("running");
                fxBg.style.opacity = "";
                fxHud.style.opacity = "";
                fxDebug.style.display = "none";

                fxNode.classList.remove("active");
                fxNodeLabel.style.opacity = "";

                fxCtx.setTransform(1, 0, 0, 1, 0, 0);
                fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);

                particles = [];
                fxState = null;
            }

            /* Converts the real elapsed time (ms) into storyboard time (ms).
                   Three stretches: shrink (DURATION_SCALE), middle with packet
                   and dwell (MID_SCALE), enlarge (DURATION_SCALE). */
                function fxTimeAt(elapsed) {

                    const dockReal = FX.DOCK_MS * FX.DURATION_SCALE;
                    const midReal = 550 * FX.MID_SCALE;

                    if (elapsed < dockReal) {
                        return elapsed / FX.DURATION_SCALE - FX.DOCK_MS;
                    }

                    if (elapsed < dockReal + midReal) {
                        return (elapsed - dockReal) / FX.MID_SCALE;
                    }

                    return 550 + (elapsed - dockReal - midReal) / FX.DURATION_SCALE;
                }

            /* Animation frames stop while the tab is hidden. The storyboard clock
               skips the time spent hidden, so the transition resumes exactly where
               it stopped when the tab comes back, instead of showing the frozen
               frame and then jumping to the end. */
            let fxResumed = false;

            document.addEventListener("visibilitychange", () => {
                if (!document.hidden) {
                    fxResumed = true;
                }
            });

            function runTransition(previousPage, targetPage, done) {

                    fxResumed = false;

                    prepareFx(previousPage, targetPage);

                    requestAnimationFrame(() => requestAnimationFrame(() => {

                        const startTime = performance.now();
                        let lastFrame = startTime;
                        let pausedMs = 0;
                        let lastT = -FX.DOCK_MS;

                        const tick = now => {

                            /* The tab has just become visible again: the time since
                               the previous frame was spent hidden and does not count. */
                            if (fxResumed) {
                                pausedMs += now - lastFrame;
                                fxResumed = false;
                            }

                            lastFrame = now;

                            const t = fxTimeAt(now - startTime - pausedMs);
                            const clampedT = Math.min(t, FX.END_MS);
                            const dt = Math.min(50, Math.max(0, clampedT - lastT));

                            lastT = clampedT;

                            renderFx(clampedT, dt);

                            if (t < FX.END_MS) {
                                requestAnimationFrame(tick);
                                return;
                            }

                            completePageSwitch(targetPage);
                            cleanupFx();
                            done();
                        };

                        requestAnimationFrame(tick);
                    }));
                }

            const prefersReducedMotion =
                window.matchMedia("(prefers-reduced-motion: reduce)");

            /* =========================================================
               MAIN TRANSITION
            ========================================================= */

            function switchPage(targetPage) {

                if (
                    transitionRunning ||
                    targetPage === currentPage
                ) {
                    return;
                }

                transitionRunning = true;

                const previousPage = currentPage;

                navigation.classList.add("hidden");

                const finish = () => {
                    animateCoreToPage(targetPage, previousPage);
                    transitionRunning = false;
                };

                if (prefersReducedMotion.matches) {
                    completePageSwitch(targetPage);
                    finish();
                    return;
                }

                runTransition(previousPage, targetPage, finish);
            }

        /* =========================================================
           BUTTONS
        ========================================================= */

        buttonPage1.addEventListener(
            "click",
            () => switchPage(1)
        );

        buttonPage2.addEventListener(
            "click",
            () => switchPage(2)
        );

        /* =========================================================
           INITIAL STATE
        ========================================================= */

        setNavigationPage(1);
            updateNodes(1);
            setCorePosition(1);
    </script>

</body>

</html>
